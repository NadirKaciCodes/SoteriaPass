[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soteriapass"
version = "0.1.0"
description = "A secure local desktop password manager"
requires-python = ">=3.11"
dependencies = [
    "PySide6",
    "cryptography",
    "argon2-cffi",
    "platformdirs",
]

[tool.setuptools.packages.find]
where = ["src"]